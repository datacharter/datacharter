# Desktop app matrix: macOS .dmg (arm64 + intel) and Windows .exe (zipped),
# attached to the triggering release. Independent of release.yml — a desktop
# build failure must never block the PyPI release.
#
# Unsigned until Apple Developer secrets exist. Signing and notarization
# steps below are gated on APPLE_CERT_P12 / APPLE_API_KEY_ID; empty secrets
# keep the unsigned beta path. Enrollment is a config change, not a rewrite.
name: desktop

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach artifacts to (e.g. v0.15.0)"
        required: true
  # Build (never attach) whenever frozen-build inputs change — a broken spec
  # or desktop entry otherwise sits undetected until the next release blocks.
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "src/datacharter/desktop/**"
      - "src/datacharter/selftest.py"
      - "src/datacharter/smoke.py"
      - "scripts/bridge_check.py"
      - ".github/workflows/desktop.yml"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macos-arm64
            kind: dmg
          - os: windows-latest
            label: windows-x64
            kind: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Release event: build the tagged code. Dispatch: build the current
          # branch (lets us attach beta artifacts to an older tag).
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # The built UI is gitignored, so a fresh checkout has none — without this
      # the frozen app serves {"detail":"Not Found"} instead of the explorer.
      - name: Build UI into the package
        shell: bash
        run: ./scripts/build_ui.sh

      - name: Verify UI is present
        shell: bash
        run: test -f src/datacharter/server/static/index.html

      - name: Install
        shell: bash
        run: |
          uv venv .buildenv --python 3.12
          uv pip install --python .buildenv/bin/python ".[desktop]" pyinstaller 2>/dev/null \
            || uv pip install --python .buildenv/Scripts/python.exe ".[desktop]" pyinstaller

      - name: Build
        shell: bash
        run: |
          PYI=.buildenv/bin/pyinstaller; [ -f "$PYI" ] || PYI=.buildenv/Scripts/pyinstaller.exe
          "$PYI" desktop/datacharter.spec --workpath desktop/build --distpath desktop/dist -y

      - name: Resolve frozen binary path
        shell: bash
        run: |
          if [ "${{ matrix.kind }}" = "dmg" ]; then
            echo "BIN=desktop/dist/DataCharter.app/Contents/MacOS/DataCharter" >> "$GITHUB_ENV"
          else
            echo "BIN=desktop/dist/DataCharter.exe" >> "$GITHUB_ENV"
          fi

      - name: Selftest (import every module + dynamic tripwires, in the FROZEN build)
        shell: bash
        run: |
          # Catches modules PyInstaller silently dropped (pytz, multipart,
          # ruamel each shipped missing from a green build).
          "$BIN" --selftest

      - name: Smoke battery (real endpoints against the FROZEN build)
        shell: bash
        run: |
          # Exercises timestamptz fetch (pytz), upload (multipart), contract
          # writes (ruamel), masking, snapshots, audit, and that / serves the
          # real UI — the classes that only break in frozen builds.
          "$BIN" --smoke --demo
          echo "smoke battery passed on ${{ matrix.label }}"

      - name: MCP bridge handshake (the FROZEN app re-execing itself)
        shell: bash
        run: |
          # Claude Code spawns this exact binary as its MCP bridge; the argv
          # dispatch shipped dead once. Real initialize + tools/list + query.
          WS="$RUNNER_TEMP/bridge-ws"
          mkdir -p "$WS"
          printf 'a,b\n1,2\n' > "$WS/f.csv"
          printf 'version: 1\nsources:\n  f:\n    type: csv\n    path: f.csv\n' \
            > "$WS/charter.yaml"
          PY=.buildenv/bin/python; [ -f "$PY" ] || PY=.buildenv/Scripts/python.exe
          "$PY" scripts/bridge_check.py "$BIN" "$WS"

      - name: Bundle assertions (version + critical modules present)
        if: matrix.kind == 'dmg'
        shell: bash
        run: |
          PLIST="desktop/dist/DataCharter.app/Contents/Info.plist"
          WANT=$(.buildenv/bin/python -c "from datacharter import __version__; print(__version__)")
          GOT=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$PLIST")
          echo "Info.plist version: $GOT (want $WANT)"
          test "$GOT" = "$WANT"
          test -d desktop/dist/DataCharter.app/Contents/Frameworks/pytz

      - name: Window proof macOS (launch the real GUI, assert liveness, screenshot)
        if: matrix.kind == 'dmg'
        shell: bash
        run: |
          # The battery proves the server; this proves the .app actually opens
          # as a GUI (pywebview/WKWebView wiring only breaks at launch).
          "$BIN" --demo & APP_PID=$!
          sleep 60
          if ! ps -p $APP_PID > /dev/null; then
            echo "::error::app process died within 60s of GUI launch"
            exit 1
          fi
          screencapture -x macos-app-screenshot.png || true
          kill $APP_PID || true

      - name: Upload macOS screenshot
        if: always() && matrix.kind == 'dmg'
        uses: actions/upload-artifact@v7
        with:
          name: macos-app-screenshot
          path: macos-app-screenshot.png
          if-no-files-found: ignore

      - name: Window proof (launch the real GUI, assert the window, screenshot)
        if: matrix.kind == 'zip'
        shell: powershell
        run: |
          Start-Process -FilePath "desktop\dist\DataCharter.exe" -ArgumentList "--demo"
          $deadline = (Get-Date).AddSeconds(120)
          $title = ""
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 3
            $p = Get-Process DataCharter -ErrorAction SilentlyContinue
            if ($p -and $p.MainWindowTitle) { $title = $p.MainWindowTitle; break }
          }
          Write-Host "MainWindowTitle: '$title'"
          Start-Sleep -Seconds 45  # cold runner: server boot + WebView2 paint
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $vs = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $vs.Width, $vs.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($vs.Location, [System.Drawing.Point]::Empty, $vs.Size)
          $bmp.Save("$env:GITHUB_WORKSPACE\windows-app-screenshot.png")
          Stop-Process -Name DataCharter -Force -ErrorAction SilentlyContinue
          if (-not $title) { Write-Error "No app window ever appeared"; exit 1 }
          # UI-served proof moved into the smoke battery's `ui-served` check,
          # which fetches / from the FROZEN app — the old source-checkout grep
          # here could never fail.

      - name: Upload window screenshot
        if: always() && matrix.kind == 'zip'
        uses: actions/upload-artifact@v7
        with:
          name: windows-app-screenshot
          path: windows-app-screenshot.png
          if-no-files-found: ignore

      - name: Import Apple signing certificate
        if: matrix.kind == 'dmg' && secrets.APPLE_CERT_P12 != ''
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          CERT="$RUNNER_TEMP/dev-id.p12"
          echo "$APPLE_CERT_P12" | base64 --decode > "$CERT"
          KEYCHAIN="$RUNNER_TEMP/dc-signing.keychain-db"
          PW="$(openssl rand -base64 24)"
          security create-keychain -p "$PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PW" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PW" "$KEYCHAIN"

      - name: Sign DataCharter.app
        if: matrix.kind == 'dmg' && secrets.APPLE_CERT_P12 != ''
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          APP="desktop/dist/DataCharter.app"
          codesign --force --deep --options runtime \
            --entitlements desktop/entitlements.plist \
            --sign "$APPLE_SIGN_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package
        if: github.event_name != 'push'
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          VER="${TAG#v}"
          mkdir -p out
          if [ "${{ matrix.kind }}" = "dmg" ]; then
            hdiutil create -volname "DataCharter" \
              -srcfolder desktop/dist/DataCharter.app \
              -ov -format UDZO "out/DataCharter-${VER}-${{ matrix.label }}.dmg"
          else
            7z a "out/DataCharter-${VER}-${{ matrix.label }}.zip" ./desktop/dist/DataCharter.exe
          fi
          ls -la out/

      - name: Notarize and staple the dmg
        if: matrix.kind == 'dmg' && github.event_name != 'push' && secrets.APPLE_API_KEY_ID != ''
        env:
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_NOTARY_KEY" > "$KEY"
          DMG=$(ls out/*.dmg)
          xcrun notarytool submit "$DMG" \
            --key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Attach to release
        if: github.event_name != 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          gh release upload "$TAG" out/* --clobber
