# Weekly OS × Python sweep. Regular CI is ubuntu + one Python; users run
# macOS/Windows and every Python we claim — platform-only breakage (file
# locking, keyring, path semantics) otherwise waits for a bug report.
name: weekly-matrix

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

jobs:
  matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Install
        shell: bash
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[dev]"
      - name: Unit tests
        shell: bash
        run: |
          PY=.venv/bin/python; [ -f "$PY" ] || PY=.venv/Scripts/python.exe
          "$PY" -m pytest -q

  wheel-gate:
    # The full artifact gate on every OS — catches wheel-only breakage that
    # source installs (and ubuntu-only CI) never see.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: astral-sh/setup-uv@v7
      - name: Build wheel (UI bundled)
        shell: bash
        run: |
          ./scripts/build_ui.sh
          uv build
      - name: Install wheel + gate
        shell: bash
        run: |
          uv venv gate-venv
          PY=gate-venv/bin/python; [ -f "$PY" ] || PY=gate-venv/Scripts/python.exe
          uv pip install --python "$PY" dist/*.whl
          "$PY" scripts/wheel_gate.py
