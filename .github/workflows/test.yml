name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Install (from the lockfile)
        run: uv sync --extra dev --frozen
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Unit tests
        run: .venv/bin/pytest -q

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: charter
          POSTGRES_PASSWORD: charter_test_pw
          POSTGRES_DB: demo
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U charter -d demo"
          --health-interval 2s --health-timeout 2s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_test_pw
          MYSQL_USER: charter
          MYSQL_PASSWORD: charter_test_pw
          MYSQL_DATABASE: demo
        ports:
          - 53306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pcharter_test_pw -ucharter"
          --health-interval 2s --health-timeout 2s --health-retries 60
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Install (from the lockfile)
        run: uv sync --extra dev --frozen
      - name: Seed databases
        run: |
          sudo apt-get install -y -q postgresql-client mysql-client >/dev/null
          PGPASSWORD=charter_test_pw psql -h 127.0.0.1 -p 55432 -U charter -d demo \
            -f tests/integration/seed/postgres.sql
          mysql -h 127.0.0.1 -P 53306 -ucharter -pcharter_test_pw demo \
            < tests/integration/seed/mysql.sql
      - name: Integration tests
        run: .venv/bin/pytest -m integration -q

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        run: cd ui && npm ci
      - name: Typecheck + build
        run: cd ui && npm run build
      - name: Unit test UI
        run: cd ui && npm test

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: astral-sh/setup-uv@v7
      - name: Build UI into package
        run: ./scripts/build_ui.sh
      - name: Fetch VidaiMock (e2e mock LLM; Apache-2.0, checksum-pinned)
        run: |
          ver=v0.2.9
          base="https://github.com/vidaiUK/VidaiMock/releases/download/$ver"
          curl -fsSL -o vm.tar.gz "$base/vidaimock-linux-x64.tar.gz"
          curl -fsSL -o vm.sha256 "$base/vidaimock-linux-x64.sha256"
          got=$(sha256sum vm.tar.gz | awk '{print $1}')
          want=$(awk '{print $1}' vm.sha256)
          test "$got" = "$want" || { echo "VidaiMock checksum mismatch: $got != $want"; exit 1; }
          mkdir -p vidaimock-bin && tar -xzf vm.tar.gz -C vidaimock-bin
          bin=$(find "$PWD/vidaimock-bin" -type f -name vidaimock | head -1)
          chmod +x "$bin"
          echo "VIDAIMOCK_BIN=$bin" >> "$GITHUB_ENV"
      - name: Install + e2e
        run: |
          uv sync --extra dev --frozen
          .venv/bin/pytest -m e2e -q

  journey:
    # The first-session user journey, in a real browser, against the BUILT
    # wheel — the artifact users install, not the source tree. Six of the
    # fifteen launch-week defects lived on paths only this layer can see.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: astral-sh/setup-uv@v7
      - name: Build wheel (UI bundled)
        run: |
          ./scripts/build_ui.sh
          uv build
      - name: Install the wheel into a clean venv
        run: |
          uv venv journey-venv
          uv pip install --python journey-venv/bin/python dist/*.whl
      - name: Install playwright chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve a fresh workspace from the wheel
        run: |
          journey-venv/bin/datacharter init /tmp/journey-ws
          nohup journey-venv/bin/datacharter serve /tmp/journey-ws --port 8399 \
            > /tmp/journey-serve.log 2>&1 &
          for i in $(seq 30); do
            curl -sf http://127.0.0.1:8399/api/health && break; sleep 1
          done
      - name: Run the journey
        run: node scripts/journey.mjs --port 8399
      - name: Server log on failure
        if: failure()
        run: cat /tmp/journey-serve.log
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-shots
          path: journey-shots/
          if-no-files-found: ignore
