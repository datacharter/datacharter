# Publishes to PyPI via Trusted Publishing (OIDC) — no stored token.
#
# One-time PyPI setup (Project → Publishing → Add a pending publisher):
#   PyPI Project name: datacharter
#   Owner:             datacharter
#   Repository name:   datacharter
#   Workflow filename: release.yml
#   Environment name:  pypi
# Then create a GitHub Release (tag like v0.1.0) to trigger this workflow.
name: release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: astral-sh/setup-uv@v7
      - name: Build UI into the package
        run: ./scripts/build_ui.sh
      - name: Build sdist + wheel
        run: uv build
      - name: Validate metadata and README rendering
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # The artifact is what ships: install the built wheel into a clean env and
  # run the runtime smoke battery + MCP handshake before anything publishes.
  gate:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Install the wheel into a clean environment
        run: |
          uv venv .gateenv --python 3.12
          uv pip install --python .gateenv/bin/python dist/*.whl
      - name: Wheel gate (smoke battery + MCP)
        run: .gateenv/bin/python scripts/wheel_gate.py

      - name: Release-machine gate file (docs/RELEASE-RITUAL.md)
        env:
          REQUIRE_VERIFIED: ${{ vars.REQUIRE_VERIFIED }}
        run: |
          VER=$(.gateenv/bin/python -c "from datacharter import __version__; print(__version__)")
          FILE="docs/releases/v${VER}-verified.txt"
          if [ -f "$FILE" ]; then
            echo "release-machine verification on file:"
            cat "$FILE"
          elif [ "$REQUIRE_VERIFIED" = "true" ]; then
            echo "::error::$FILE missing — run 'bash scripts/release_gate.sh' on the release machine (live Claude round + journey on the wheel) and commit the file it writes before tagging."
            exit 1
          else
            echo "::warning::No verification file ($FILE). Set repo variable REQUIRE_VERIFIED=true to make the release-machine gate mandatory."
          fi

  publish:
    needs: [build, gate]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/datacharter/
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing + PEP 740 attestations
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Sign each artifact and upload PEP 740 provenance attestations (Sigstore).
          attestations: true
