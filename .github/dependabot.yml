version: 2
updates:
  # Python runtime + dev dependencies (pyproject.toml).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  # Front-end dependencies (npm lockfile).
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    groups:
      ui-minor-patch:
        update-types: [minor, patch]

  # The GitHub Actions the workflows pin.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
