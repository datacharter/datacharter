<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
<head>
  {% include head.html %}
</head>
<body>
  <a id="skip-to-content" href="#content">Skip to the content</a>
  {% include nav.html %}
  <div class="docs-shell">
    {% include docs-nav.html %}
    <article class="docs-main" id="content" role="main">
      <h1 class="docs-title">{{ page.title }}</h1>
      {% if page.description %}<p class="docs-lede">{{ page.description }}</p>{% endif %}
      <div class="docs-body">
        {{ content }}
      </div>
    </article>
  </div>
  {% include footer.html %}
  {% include chrome-js.html %}
</body>
</html>
