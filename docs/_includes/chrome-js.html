<script>
(function () {
  var dds = document.querySelectorAll(".dd");
  document.addEventListener("click", function (e) {
    dds.forEach(function (dd) { if (dd.open && !dd.contains(e.target)) dd.open = false; });
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") dds.forEach(function (dd) { dd.open = false; });
  });
  document.querySelectorAll(".copy-mail").forEach(function (el) {
    el.addEventListener("click", function (e) {
      e.preventDefault();
      navigator.clipboard.writeText("hello@datacharter.dev").then(function () {
        var t = el.textContent;
        el.textContent = "copied \u2713";
        setTimeout(function () { el.textContent = t; }, 1500);
      });
    });
  });
})();
</script>
