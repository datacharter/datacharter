# GitHub Pages (Jekyll) configuration for the DataCharter docs site.
# Serve from this /docs folder: repo Settings -> Pages -> "Deploy from a
# branch" -> branch + /docs. index.html is the landing page (passed through
# untouched); the Markdown pages render with the theme below.
title: DataCharter
description: Contract-governed local data exploration, powered by DuckDB.
url: https://datacharter.dev
theme: jekyll-theme-cayman
show_downloads: false

# jekyll-seo-tag ships with the theme; jekyll-sitemap adds /sitemap.xml
# (both are on the GitHub Pages plugin whitelist).
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Blog posts live under _posts/ and publish at /blog/<title>/.
# Scoped to posts via defaults — a global `permalink` would switch every doc
# page to directory-style URLs and 404 all existing *.html links.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      permalink: /blog/:title/
      image: /assets/hero.png
  # Site-wide social-card image: pages without their own `image:` get the
  # hero, which also upgrades twitter:card to summary_large_image.
  - scope:
      path: ""
    values:
      image: /assets/hero.png

# Dev-internal docs live in this folder but must never be published.
exclude:
  - DESIGN.md
  - PLAN.md
  - PROGRESS.md
  - README.md
  - SECURITY_AUDIT.md
  - TUTORIAL_MODE.md
  - ROADMAP-strategy.md
  - LAUNCH.md
  - QA-PLAN.md
  - RELEASE-RITUAL.md
  - superpowers
